name: candytest

services:
  candytest:
    # Default: pull the published GitHub Container Registry image.
    image: ghcr.io/${GITHUB_OWNER:?Set GITHUB_OWNER in .env}/candytest:${CANDYTEST_VERSION:-latest}
    # For a local image instead, uncomment the following and optionally remove image above:
    # build:
    #   context: .
    environment:
      CANDYTEST_DEPLOYMENT: server
      CANDYTEST_HOST: 0.0.0.0
      CANDYTEST_PORT: "8765"
      CANDYTEST_DATA_DIR: /data
      CANDYTEST_OPEN_BROWSER: "0"
      HOME: /tmp/candytest-home
      XDG_CACHE_HOME: /tmp/candytest-home/.cache
      XDG_CONFIG_HOME: /tmp/candytest-home/.config
      XDG_DATA_HOME: /tmp/candytest-home/.local/share
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8765"
    volumes:
      - candytest-data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    user: "node"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    restart: unless-stopped
    # Keep exactly one Compose service instance: JobManager state is process-local.
    healthcheck:
      test:
        - CMD
        - /opt/candytest-venv/bin/python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8765/healthz', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      CANDYTEST_DOMAIN: ${CANDYTEST_DOMAIN:?Set CANDYTEST_DOMAIN in .env}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL in .env}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:?Set CADDY_BASIC_AUTH_USER in .env}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:?Set CADDY_BASIC_AUTH_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      candytest:
        condition: service_healthy

volumes:
  candytest-data:
  caddy-data:
  caddy-config:
