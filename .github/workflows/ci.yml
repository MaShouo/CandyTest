name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q candytest tests run.py
      - run: python -m unittest discover -s tests -v

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose deployment layers
        run: |
          cp .env.example .env
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml config --quiet
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml config --quiet
          NPM_NETWORK=candytest-ci-npm docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.npm.yaml config --quiet
          CANDYTEST_DOMAIN=candy.example.invalid docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.caddy.yaml config --quiet
      - name: Build temporary smoke-test image
        run: docker build --tag candytest:ci .
      - name: Run Compose login and CLI smoke test
        run: |
          cat > .env <<EOF
          CANDYTEST_IMAGE=candytest:ci
          CANDYTEST_MODE=host
          CANDYTEST_PORT=18765
          CANDYTEST_BIND_ADDRESS=127.0.0.1
          CANDYTEST_MEMORY_LIMIT=2g
          COOKIE_SECURE=0
          EOF
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml config --quiet
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml up --detach --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/healthz | python3 -c "import json,sys; assert json.load(sys.stdin) == {'status':'ok'}"; then break; fi
            if [ "$attempt" = 30 ]; then docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml logs; exit 1; fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/)" = "302"
          curl --fail --silent --cookie-jar cookies.txt http://127.0.0.1:18765/login > login.html
          TOKEN="$(sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p' login.html)"
          test -n "$TOKEN"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --cookie cookies.txt --cookie-jar cookies.txt --data-urlencode "username=admin" --data-urlencode "password=admin" --data-urlencode "csrf_token=$TOKEN" http://127.0.0.1:18765/login)" = "302"
          curl --fail --silent --cookie cookies.txt http://127.0.0.1:18765/api/runtime | python3 -c "import json,sys; assert json.load(sys.stdin)['deployment'] == 'server'"
          curl --fail --silent --cookie cookies.txt http://127.0.0.1:18765/ > index.html
          ACCOUNT_TOKEN="$(sed -n 's/.*name="csrf-token" content="\([^"]*\)".*/\1/p' index.html)"
          test -n "$ACCOUNT_TOKEN"
          curl --fail --silent --cookie cookies.txt -H "X-CSRF-Token: $ACCOUNT_TOKEN" -H 'Content-Type: application/json' -X PUT --data '{"username":"ci-admin","current_password":"admin","new_password":"ci-only-password","new_password_confirmation":"ci-only-password"}' http://127.0.0.1:18765/api/settings/account | python3 -c "import json,sys; assert json.load(sys.stdin)['account']['username'] == 'ci-admin'"
          test "$(docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml exec -T candytest id -u)" = "1000"
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml exec -T candytest sh -c 'test -d "$HOME" && test -d "$XDG_CACHE_HOME"'
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml exec -T candytest pi --version
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml exec -T candytest codex --version
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml exec -T candytest pi --help >/dev/null
          docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml exec -T candytest codex exec --help >/dev/null
      - name: Cleanup
        if: always()
        run: docker compose --project-name candytest-ci --env-file .env -f compose.yaml -f compose.host.yaml down --volumes --remove-orphans || true

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mashouo/candytest
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
