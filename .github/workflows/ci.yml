name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q candytest run.py tests

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  container:
    name: Build and smoke-test server container
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose and Caddy configuration
        shell: bash
        run: |
          hash="$(docker run --rm caddy:2.8.4-alpine caddy hash-password --plaintext ci-only-password)"
          GITHUB_OWNER=test CANDYTEST_VERSION=ci \
            CANDYTEST_DOMAIN=candy.example.com CADDY_ACME_EMAIL=ci@example.com \
            CADDY_BASIC_AUTH_USER=ci CADDY_BASIC_AUTH_HASH="$hash" \
            docker compose config --quiet
          docker run --rm \
            -e CANDYTEST_DOMAIN=candy.example.com \
            -e CADDY_ACME_EMAIL=ci@example.com \
            -e CADDY_BASIC_AUTH_USER=ci \
            -e CADDY_BASIC_AUTH_HASH="$hash" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: candytest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test health and bundled CLIs
        shell: bash
        run: |
          docker volume create candytest-ci-data
          docker run -d --name candytest-ci \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m \
            --mount source=candytest-ci-data,target=/data \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 127.0.0.1:18765:8765 \
            candytest:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/healthz | grep -q '"status":"ok"'; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs candytest-ci
              exit 1
            fi
            sleep 1
          done
          docker exec candytest-ci pi --version
          docker exec candytest-ci codex --version

      - name: Clean up smoke-test container
        if: always()
        run: |
          docker rm -f candytest-ci 2>/dev/null || true
          docker volume rm candytest-ci-data 2>/dev/null || true
